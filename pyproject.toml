[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitmole"
description = "Offline git repository analysis with a terminal report: hotspots, coupling, ownership, code age, secrets, repo health."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["rich>=13", "lizard>=1.24"]
keywords = ["git", "analysis", "hotspots", "code-age", "repository", "metrics"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
plots = ["git-of-theseus"]

[project.scripts]
gitmole = "gitmole.cli:main"

[project.urls]
Homepage = "https://github.com/antvinni/gitmole"

[tool.setuptools]
packages = ["gitmole"]

[tool.setuptools.dynamic]
version = { attr = "gitmole.__version__" }
