name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the golden test and the self-analysis need history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the external tools
        run: brew install scc git-sizer betterleaks jscpd osv-scanner
      - name: Install gitmole
        run: python -m pip install -e '.[structure]'   # the structure tests run where the grammars install (3.10+) and skip on 3.9
      - name: Run the tests
        run: python -m unittest discover -s tests -t .

  formula:
    name: homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: brew tap antvinni/gitmole "$PWD"
      - name: Audit
        run: brew audit --strict --online antvinni/gitmole/gitmole
      - name: Install from source
        run: brew install --build-from-source antvinni/gitmole/gitmole
      - name: Test
        run: brew test antvinni/gitmole/gitmole

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, formula]
    runs-on: macos-latest   # Homebrew is needed to refresh and verify the formula
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches __version__
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import re, sys
          tag = sys.argv[1]
          version = re.search(r'^__version__ = "([^"]+)"', open("gitmole/__init__.py").read(), re.M).group(1)
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match __version__ {version}; bump gitmole/__init__.py first")
          PY
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          overwrite: true
      - name: Create the GitHub release with the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Bump the Homebrew formula to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "dist/gitmole-${VERSION}.tar.gz" | cut -c1-64)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' \
            -e "s|^  url \".*\"$|  url \"https://github.com/antvinni/gitmole/releases/download/${GITHUB_REF_NAME}/gitmole-${VERSION}.tar.gz\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${SHA}\"|" Formula/gitmole.rb
          git commit -am "Homebrew formula: ${GITHUB_REF_NAME}"
          brew tap antvinni/gitmole "$PWD"
          brew update-python-resources antvinni/gitmole/gitmole
          cp "$(brew --repo antvinni/gitmole)/Formula/gitmole.rb" Formula/gitmole.rb
          git diff --quiet || git commit -am "Homebrew formula: ${GITHUB_REF_NAME}" --amend --no-edit
          git -C "$(brew --repo antvinni/gitmole)" reset --hard -q
          git -C "$(brew --repo antvinni/gitmole)" pull -q --ff-only "$PWD" main
          brew audit --strict --online antvinni/gitmole/gitmole
          brew install --build-from-source antvinni/gitmole/gitmole
          brew test antvinni/gitmole/gitmole
          git push origin main

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4   # the same bytes the release attached and the formula hashed
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
