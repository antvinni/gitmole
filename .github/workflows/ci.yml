name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the golden test and the self-analysis need history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the external tools
        run: brew install scc git-sizer betterleaks jscpd osv-scanner
      - name: Install gitmole
        run: python -m pip install -e '.[structure]'   # the structure tests run where the grammars install (3.10+) and skip on 3.9
      - name: Run the tests
        run: python -m unittest discover -s tests -t .

  determinism:
    name: same commit, same report
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write       # the attestation's signing identity, on pushes to main only
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the report reads the whole history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the external tools
        run: |
          brew update --quiet   # the runner image's formulae lag; the Linux job installs today's, and the two must match
          brew install scc git-sizer betterleaks jscpd osv-scanner
      - name: Install gitmole
        run: python -m pip install -e '.[structure]'
      - name: Two runs of this commit export the same JSON outside the envelope
        run: |
          export GITMOLE_NOW="$(git log -1 --format=%cs)"   # the reference date is the commit's, not the runner clock's
          gitmole . --out analysis --json first.json > /dev/null
          TZ=Asia/Tokyo LC_ALL=C gitmole . --out analysis --json other-zone.json > /dev/null   # another time zone and the C locale
          gitmole . --out analysis --json report.json > /dev/null
          python - <<'PY'
          import json, sys
          a, c, b = (json.load(open(p)) for p in ("first.json", "other-zone.json", "report.json"))
          for x in (a, b, c):
              x.pop("envelope")
          if json.dumps(a, sort_keys=True) != json.dumps(b, sort_keys=True):
              sys.exit("two runs of the same commit exported different JSON outside the envelope")
          if json.dumps(a, sort_keys=True) != json.dumps(c, sort_keys=True):
              sys.exit("a run in another time zone and locale exported different JSON outside the envelope")
          json.dump({"gitmole": b["meta"]["run"]["gitmole"], "commit": b["meta"]["run"]["commit"], "tools": b["meta"]["run"]["tools"],
                     "options": b["meta"]["run"]["options"]}, open("predicate.json", "w"), sort_keys=True)
          PY
      - name: Attest that this workflow produced this report from this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: report.json
          predicate-type: https://github.com/antvinni/gitmole/report/v1
          predicate-path: predicate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitmole-report
          path: report.json

  determinism-linux:
    name: same commit, same report on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the external tools with Homebrew on Linux, the same bottles as macOS
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update --quiet
          brew install scc git-sizer betterleaks jscpd osv-scanner
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install gitmole
        run: python -m pip install -e '.[structure]'
      - name: Export this commit's report
        run: |
          export GITMOLE_NOW="$(git log -1 --format=%cs)"
          gitmole . --out analysis --json report-linux.json > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitmole-report-linux
          path: report-linux.json

  determinism-platforms:
    name: same report on macOS and Linux
    runs-on: ubuntu-latest
    needs: [determinism, determinism-linux]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitmole-report
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitmole-report-linux
      - name: The two platforms export the same JSON outside the envelope
        run: |
          python3 - <<'PY'
          import json, sys
          a, b = (json.load(open(p)) for p in ("report.json", "report-linux.json"))
          ea, eb = a.pop("envelope"), b.pop("envelope")
          # a section an external tool produces can only be compared when both platforms ran the same version of it
          made_by = {"jscpd": ["duplicates"], "osv-scanner": ["dependencies"], "scc": ["size"], "betterleaks": ["secrets"], "git-sizer": ["sizer"], "lizard": ["functions"]}
          ta, tb = a["meta"]["run"].pop("tools"), b["meta"]["run"].pop("tools")
          skipped = [f"{t} ({ta.get(t)} against {tb.get(t)})" for t in sorted(set(ta) | set(tb)) if ta.get(t) != tb.get(t)]
          for t in (x for x in made_by if ta.get(x) != tb.get(x)):
              for key in made_by[t]:
                  a.pop(key, None), b.pop(key, None)
          if skipped:
              print("tool versions differ, their sections not compared:", ", ".join(skipped))
          # the objects no ref reaches belong to the clone, not to the commit (they are in the envelope for
          # that reason), and a secret found in one of them is a finding this clone has and another does not
          if ea.get("unreachable") != eb.get("unreachable"):
              print(f"the clones hold different unreachable objects ({ea.get('unreachable')} against "
                    f"{eb.get('unreachable')}), so what was scanned in them is not compared")
              for key in ("secrets", "findings"):
                  a.pop(key, None), b.pop(key, None)
          diff = sorted(k for k in set(a) | set(b) if json.dumps(a.get(k), sort_keys=True) != json.dumps(b.get(k), sort_keys=True))
          if diff:
              for key in diff:   # say what differed, not only where: a key name alone cannot be acted on
                  print(f"--- {key}\nmacOS: {json.dumps(a.get(key), sort_keys=True)[:600]}\nLinux: {json.dumps(b.get(key), sort_keys=True)[:600]}")
              sys.exit(f"macOS and Linux exported different JSON outside the envelope, in: {', '.join(diff)}")
          PY

  formula:
    name: homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tap this checkout
        run: brew tap antvinni/gitmole "$PWD"
      - name: Audit
        run: brew audit --strict --online antvinni/gitmole/gitmole
      - name: Install from source
        run: brew install --build-from-source antvinni/gitmole/gitmole
      - name: Test
        run: brew test antvinni/gitmole/gitmole

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, formula]
    runs-on: macos-latest   # Homebrew is needed to refresh and verify the formula
    environment: pypi       # a tag waits for a human here: nothing is released, bumped or published first
    permissions:
      contents: write
      pull-requests: write   # the formula bump arrives as a pull request, since main takes no direct pushes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the tag matches __version__
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import re, sys
          tag = sys.argv[1]
          version = re.search(r'^__version__ = "([^"]+)"', open("gitmole/__init__.py").read(), re.M).group(1)
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match __version__ {version}; bump gitmole/__init__.py first")
          PY
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          overwrite: true
      - name: Create the GitHub release with the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Bump the Homebrew formula to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "dist/gitmole-${VERSION}.tar.gz" | cut -c1-64)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "formula/${GITHUB_REF_NAME}" origin/main
          sed -i '' \
            -e "s|^  url \".*\"$|  url \"https://github.com/antvinni/gitmole/releases/download/${GITHUB_REF_NAME}/gitmole-${VERSION}.tar.gz\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${SHA}\"|" Formula/gitmole.rb
          git commit -am "Homebrew formula: ${GITHUB_REF_NAME}"
          brew tap antvinni/gitmole "$PWD"
          # the python dependencies are pinned in pyproject.toml, so their resources move only when a
          # release moves them: `brew update-python-resources` runs by hand, never here, since it would
          # also rewrite the pinned tool resources (gitmole/tools.py)
          # the bump lives on formula/<tag>, not on main: this checkout has no local main since the
          # branch was created, and asking the tap for one failed the v0.34.0 release with
          # "fatal: couldn't find remote ref main". Both branches are one lineage, so --ff-only holds
          # whichever of them brew's clone of this directory landed on.
          git -C "$(brew --repo antvinni/gitmole)" pull -q --ff-only "$PWD" "formula/${GITHUB_REF_NAME}"
          brew audit --strict --online antvinni/gitmole/gitmole
          brew install --build-from-source antvinni/gitmole/gitmole
          brew test antvinni/gitmole/gitmole
          # main takes pull requests only, so the bump arrives as one: a branch this job can push, and a
          # merge a person makes. The formula is verified above before either happens.
          git push origin "formula/${GITHUB_REF_NAME}"
          # Opening the pull request needs the repository's "Allow GitHub Actions to create and approve
          # pull requests", which is off on purpose: the same setting lets a workflow approve one, which
          # would satisfy this ruleset's extra approval for unattributed changes, and the formula commit
          # is the bot's. So publishing does not hang on it. The branch above is pushed and verified; if
          # the pull request cannot be opened, the run says where to open it and the release carries on.
          # v0.34.0 and v0.34.1 both failed here after the formula had been audited, built and tested.
          if ! gh pr create --base main --head "formula/${GITHUB_REF_NAME}" \
            --title "Homebrew formula: ${GITHUB_REF_NAME}" \
            --body "The tarball this release built, audited and installed from source on this runner. Merging points \`brew upgrade gitmole\` at ${GITHUB_REF_NAME}."; then
            echo "::warning::the formula pull request was not opened; open formula/${GITHUB_REF_NAME} by hand"
            printf '%s\n' "The formula bump is on [\`formula/${GITHUB_REF_NAME}\`](https://github.com/antvinni/gitmole/pull/new/formula/${GITHUB_REF_NAME}), audited, installed from source and tested on this runner. Open and merge it to point \`brew upgrade gitmole\` at ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4, the same bytes the release attached and the formula hashed
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
