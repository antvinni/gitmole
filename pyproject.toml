[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitmole"
description = "Offline git repository analysis with a terminal report: hotspots, coupling, ownership, code age, secrets, repo health."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
# Pinned, like the tools in Formula/gitmole.rb and gitmole/tools.py: the report's wrapping comes from rich,
# its function metrics from lizard and its structure from the tree-sitter grammars, so each decides part of
# the output. Moving one is its own release. The grammars need Python 3.10, so a 3.9 install skips the
# structure step and says so; tree-sitter-php stops at 0.23.9, the last version with a source archive.
dependencies = [
    "rich==15.0.0",
    "lizard==1.24.0",
    "tree-sitter==0.26.0; python_version >= '3.10'",
    "tree-sitter-c==0.24.2; python_version >= '3.10'",
    "tree-sitter-c-sharp==0.23.5; python_version >= '3.10'",
    "tree-sitter-cpp==0.23.4; python_version >= '3.10'",
    "tree-sitter-go==0.25.0; python_version >= '3.10'",
    "tree-sitter-java==0.23.5; python_version >= '3.10'",
    "tree-sitter-javascript==0.25.0; python_version >= '3.10'",
    "tree-sitter-php==0.23.9; python_version >= '3.10'",
    "tree-sitter-python==0.25.0; python_version >= '3.10'",
    "tree-sitter-ruby==0.23.1; python_version >= '3.10'",
    "tree-sitter-rust==0.24.2; python_version >= '3.10'",
    "tree-sitter-typescript==0.23.2; python_version >= '3.10'",
]
keywords = ["git", "analysis", "hotspots", "code-age", "repository", "metrics"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
plots = ["git-of-theseus"]
# kept as an alias: the grammars are ordinary dependencies since 0.32.0, so `gitmole[structure]` installs
# what a plain install already has
structure = []

[project.scripts]
gitmole = "gitmole.cli:main"

[project.urls]
Homepage = "https://github.com/antvinni/gitmole"

[tool.setuptools]
packages = ["gitmole"]

[tool.setuptools.dynamic]
version = { attr = "gitmole.__version__" }
