# gitmole as a pre-commit hook (https://pre-commit.com/#creating-new-hooks).
#
#   repos:
#     - repo: https://github.com/antvinni/gitmole
#       rev: v0.13.0
#       hooks:
#         - id: gitmole-risk            # pre-push: the whole change against the branch's history
#           args: [--risk, origin/main, --risk-threshold, "10"]
#         - id: gitmole-hook            # pre-commit: the staged files against the last analysis
#           args: [analysis-repo, --no-run, --hook, --risk-threshold, "10", --]
#
# The external tools (scc, git-sizer, betterleaks, jscpd, osv-scanner) have to be on PATH for
# gitmole-risk; gitmole-hook only reads an output directory an earlier run wrote.
- id: gitmole-risk
  name: gitmole change risk
  description: Score the files changed since the base branch by their share of the repository's revisions × lines of code; fail over the threshold.
  entry: gitmole .
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-push]
- id: gitmole-hook
  name: gitmole watch-list gate
  description: Score the given files against an earlier gitmole run (the output directory is the first argument); exit 2 over --risk-threshold.
  entry: gitmole
  language: python
  pass_filenames: true
  stages: [pre-commit]
