[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitmole"
description = "Offline git repository analysis with a terminal report: hotspots, coupling, ownership, code age, secrets, repo health."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["rich>=13", "lizard>=1.24"]
keywords = ["git", "analysis", "hotspots", "code-age", "repository", "metrics"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
plots = ["git-of-theseus"]
# nesting, cognitive complexity, debt markers and the import graph: py-tree-sitter and one compiled grammar per
# language, MIT wheels with no compiler and no network needed
structure = [
    "tree-sitter>=0.23; python_version >= '3.10'",
    "tree-sitter-python>=0.23; python_version >= '3.10'",
    "tree-sitter-javascript>=0.23; python_version >= '3.10'",
    "tree-sitter-typescript>=0.23; python_version >= '3.10'",
    "tree-sitter-go>=0.23; python_version >= '3.10'",
    "tree-sitter-rust>=0.23; python_version >= '3.10'",
    "tree-sitter-java>=0.23; python_version >= '3.10'",
    "tree-sitter-c>=0.23; python_version >= '3.10'",
    "tree-sitter-cpp>=0.23; python_version >= '3.10'",
    "tree-sitter-ruby>=0.23; python_version >= '3.10'",
    "tree-sitter-c-sharp>=0.23; python_version >= '3.10'",
    "tree-sitter-php>=0.23; python_version >= '3.10'",
]

[project.scripts]
gitmole = "gitmole.cli:main"

[project.urls]
Homepage = "https://github.com/antvinni/gitmole"

[tool.setuptools]
packages = ["gitmole"]

[tool.setuptools.dynamic]
version = { attr = "gitmole.__version__" }
