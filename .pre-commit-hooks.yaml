# gitmole as a pre-commit hook (https://pre-commit.com/#creating-new-hooks).
#
#   repos:
#     - repo: https://github.com/antvinni/gitmole
#       rev: vX.Y.Z                   # the latest release tag; `pre-commit autoupdate` fills it in
#       hooks:
#         - id: gitmole-risk            # pre-push: the whole change against the branch's history
#           args: [--risk, origin/main, --risk-threshold, "10"]
#         - id: gitmole-hook            # pre-commit: the staged files against the last analysis
#           args: [analysis-repo, --no-run, --hook, --]
#
# The external tools (scc, betterleaks, osv-scanner) have to be on PATH, or
# installed once with `gitmole --install-tools`, for gitmole-risk; gitmole-hook only reads an
# output directory an earlier run wrote, and never fails the commit: the
# history score is one no commit can lower, so it is printed, not enforced.
- id: gitmole-risk
  name: gitmole change risk
  description: Score the files changed since the base branch by their share of the repository's revisions × lines of code; fail over the threshold.
  entry: gitmole .
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-push]
- id: gitmole-hook
  name: gitmole watch-list gate
  description: Say what history says about the given files, from an earlier gitmole run (the output directory is the first argument); never fails.
  entry: gitmole
  language: python
  pass_filenames: true
  verbose: true
  stages: [pre-commit]
